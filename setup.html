<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setup Akun</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f4f6;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}form{background:#fff;padding:26px;border-radius:16px;width:100%;max-width:380px}label{display:block;margin-top:12px;font-size:14px}input{width:100%;padding:10px;margin-top:4px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#0f2747;color:#fff;font-weight:600}#msg{margin-top:14px;font-size:14px;white-space:pre-wrap}</style></head><body>
<form id="f"><h2>Buat Akun Admin (sekali saja)</h2><p style="font-size:14px;color:#555">Akun ini bisa masuk ke GSB dan BDP. Hapus file ini dari Vercel setelah selesai.</p>
<label>Username (huruf kecil/angka)</label><input id="u" value="admin" required pattern="[a-z0-9._-]{3,}" autocapitalize="none">
<label>Kata sandi (min. 6 karakter)</label><input id="p" type="text" value="admin123" minlength="6" required>
<button>Buat akun</button><div id="msg"></div></form>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const CFG={apiKey:"AIzaSyC79IURaZhlsP8FX8SrcCc7o8eDPny6ba4",authDomain:"bamboocorp-1c074.firebaseapp.com",projectId:"bamboocorp-1c074",storageBucket:"bamboocorp-1c074.firebasestorage.app",messagingSenderId:"918778586590",appId:"1:918778586590:web:2d91c1a648d0df0258a94f"};
const app=initializeApp(CFG),auth=getAuth(app),db=getFirestore(app),m=document.getElementById('msg');
document.getElementById('f').onsubmit=async e=>{e.preventDefault();
const un=u.value.trim().toLowerCase(),pw=p.value,em=un+'@bamboocorp.app';let cred;m.textContent='Memproses...';
try{try{cred=await createUserWithEmailAndPassword(auth,em,pw)}catch(er){if(er.code!=='auth/email-already-in-use')throw er;cred=await signInWithEmailAndPassword(auth,em,pw)}}
catch(er){m.textContent='Gagal membuat akun: '+er.code+(er.code==='auth/operation-not-allowed'?'\nAktifkan Email/Password di Firebase Console > Authentication > Sign-in method.':'');return}
const uid=cred.user.uid;
try{await setDoc(doc(db,'users',uid),{username:un,role:'admin',businesses:['GSB','BDP']});m.textContent='Berhasil! Akun "'+un+'" siap dipakai untuk GSB dan BDP.\nSekarang buka halaman utama dan masuk dengan username tersebut.'}
catch(er){m.textContent='Akun login sudah dibuat, tapi dokumen akses ditolak ('+er.code+').\nBuat manual di Firebase Console > Firestore > koleksi "users" > Document ID:\n'+uid+'\nField: businesses (array) = GSB, BDP ; role (string) = admin'}};
</script></body></html>
